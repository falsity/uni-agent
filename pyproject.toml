[project]
name = "uni-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "falsity", email = "1305543690@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.3.6",
    "tavily-python>=0.7.19",
    "python-dotenv>=1.0.0",
    "langchain-openai>=1.1.7",
    "markdownify>=1.2.2",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph-checkpoint-postgres>=3.0.3",
    "psycopg[binary,pool]>=3.2.0",
    "httpx[socks]>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-timeout>=2.3.0"]
# Pin compatible langgraph versions to avoid thread_ttl / API mismatch (0.7.21 + runtime 0.23.x).
langgraph-dev = [
    "langgraph-cli[inmem]",
    "langgraph-api==0.6.22",
    "langgraph-runtime-inmem>=0.21.0,<0.22.0",
]

[tool.uv]
# Force these versions when resolving (e.g. with --extra langgraph-dev).
constraint-dependencies = [
    "langgraph-api==0.6.22",
    "langgraph-runtime-inmem>=0.21.0,<0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
# Exit on first failure; full traceback
addopts = "-x --tb=long"
markers = [
    "integration: marks tests that need DB/LLM (deselect with -m 'not integration')",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
